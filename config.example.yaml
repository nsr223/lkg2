# Settings for the LKG 2.0 Q&A service (server/app.py).
# Changes apply to the next question; no restart needed.
# Copy this file to config.yaml and edit the copy: config.yaml is not committed (git ignores it).

# How questions are answered: "plain-llm" (the model alone, from memory), "rag" (LKG 2.0 is searched first and
# the articles found are given to the model) or "rag-graph" (the same, and links from the best articles are
# followed; scenario 3a) or "graph-tools" (the model queries LKG 2.0 itself with tools; scenario 3b, local models
# that support tool calling). rag, rag-graph and graph-tools need the search database (see the README).
scenario: plain-llm

rag:
  database: search.db            # built by scripts/build_search.py; not in git
  results: 6                     # articles given to the model
  rewrite_query: true            # ask the model for legal search terms first (finds "arrendamiento" for "alquiler")
  suggest_laws: true             # ...and for the laws that probably govern the question, to search inside them
  max_chars: 3000                # longest piece of one article given to the model (long articles are cut to the best part);
                                 # chosen on the 2020 Workers' Statute dataset (legal-qa-benchmark/scripts/tune_rag_2020.py)
  fix_citations: true           # if the model puts the wrong [n] next to an article it names, correct it to the right source
                                 # (the answer before the fix is kept in answer_original)
  semantic:                      # search by meaning as well as by words; used only if scripts/build_vectors.py has been run
    enabled: true
    model: bge-m3                # local embedding model in Ollama (ollama pull bge-m3); must be the one the vectors were built with
    url: http://localhost:11434
    query_prefix: ""             # some models expect one, e.g. "query: " for the e5 family; bge-m3 needs none
    weight: 1.0                  # how much meaning counts next to words
  graph:                         # scenario 3 (rag-graph): follow links from the best articles found
    slots: 1                     # how many of the places go to articles reached by a link
    dated: true                  # if the question asks about a past date ("en 2014", "antes de 2015"), also give each article
                                 # as it read then, when it was different (from the version history in data/hist)
    links: [text]                # text = articles cited in the text of the best results;
                                 # official = laws officially linked to theirs (developed by, issued under...)

# Which model answers: "local" (Ollama on this computer) or "frontier" (a hosted model; needs an API key in .env).
mode: local

local:
  model: qwen2.5:7b              # any model pulled with `ollama pull`, e.g. llama3.1:8b, gemma2:9b
  url: http://localhost:11434
  num_ctx: 8192                  # context length; RAG prompts need more than Ollama's default
  num_ctx_tools: 16384           # context length for graph-tools, where tool results add up over several rounds
  think: false                   # thinking models (qwen3 and later) answer directly instead of thinking first

frontier:
  provider: anthropic            # anthropic, openai, gemini or deepseek
  model: claude-sonnet-5-5       # a model name from that provider (e.g. gemini-3.5-flash for gemini, deepseek-chat for deepseek)
                                 # POST /api/question picks the provider from the model name instead

evaluation:                      # POST /api/evaluation: models that grade an answer; each needs its API key in .env
  judges: [claude-sonnet-5-5, gemini-3.5-flash, deepseek-chat]

temperature: 0                   # remove this line if a model rejects it
timeout: 120                     # seconds to wait for an answer
port: 8000

# Demo questions for the Q&A tab. Kept out of git (private/ is ignored) so they never become public.
questions_file: private/questions.json
